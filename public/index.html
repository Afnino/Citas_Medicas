<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asistente de citas medicas</title>
  <style>
    :root { --fg:#111; --bg:#fff; --accent:#0b4f8a; --muted:#444; --border:#222; }
    @media (prefers-color-scheme: dark) { :root { --fg:#f2f2f2; --bg:#111; --accent:#7ab8f5; --muted:#ccc; --border:#ddd; } }
    body { font: 1.125rem/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); max-width: 46rem; margin: 0 auto; padding: 1rem; }
    h1 { font-size: 1.5rem; }
    .skip { position:absolute; left:-999px; } .skip:focus { left:1rem; top:1rem; background:var(--bg); padding:.5rem; }
    button, input { font: inherit; color: var(--fg); background: var(--bg); border: 2px solid var(--border); border-radius: .5rem; padding: .6rem 1rem; }
    button { cursor: pointer; font-weight: 600; }
    button:focus-visible, input:focus-visible { outline: 4px solid var(--accent); outline-offset: 2px; }
    button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
    #log { list-style: none; padding: 0; margin: 1rem 0; min-height: 10rem; }
    #log li { border: 2px solid var(--border); border-radius: .5rem; padding: .6rem .8rem; margin-bottom: .6rem; }
    /* No dependemos solo del color: cada mensaje lleva un prefijo de texto ("Tu:" / "Asistente:") y el tuyo va con borde punteado */
    #log li.user { border-style: dashed; }
    #log ol { margin: .4rem 0 0; }
    form { display: flex; gap: .5rem; flex-wrap: wrap; }
    form input { flex: 1 1 14rem; }
    .row { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; margin: .75rem 0; }
    #status { color: var(--muted); min-height: 1.5rem; }
  </style>
</head>
<body>
  <a class="skip" href="#message">Ir al campo de mensaje</a>
  <header>
    <h1>Asistente de citas medicas</h1>
    <p>Escribe o usa el microfono. Ejemplos: "Quiero una cita con dermatologia", "Que medicos tienen disponibilidad manana", "Quiero cancelar mi cita".</p>
  </header>

  <main>
    <div class="row">
      <button id="enter" type="button">Entrar como invitado</button>
      <label><input id="speak" type="checkbox" checked> Leer respuestas en voz alta</label>
    </div>

    <p id="status" role="status" aria-live="polite"></p>

    <h2 id="conv">Conversacion</h2>
    <ul id="log" role="log" aria-live="polite" aria-labelledby="conv"></ul>

    <form id="form" aria-label="Enviar mensaje al asistente">
      <label for="message">Tu mensaje</label>
      <input id="message" type="text" autocomplete="off" disabled>
      <button id="send" type="submit" disabled>Enviar</button>
      <button id="mic" type="button" aria-pressed="false" disabled>Hablar</button>
    </form>
  </main>

<script>
  const $ = (id) => document.getElementById(id);
  let token = null;   // el token vive solo en memoria
  let context = {};   // estado de la conversacion que el servidor nos devuelve y reenviamos

  const setStatus = (text) => { $("status").textContent = text; };

  function addMessage(who, text, options) {
    const li = document.createElement("li");
    li.className = who === "Tu" ? "user" : "assistant";
    li.append(`${who}: ${text}`);
    if (options && options.length) {
      const ol = document.createElement("ol");
      options.forEach((o) => { const item = document.createElement("li"); item.textContent = o.replace(/^\d+\.\s*/, ""); ol.append(item); });
      li.append(ol);
    }
    $("log").append(li);
    li.scrollIntoView({ block: "nearest" });
  }

  function speak(text) {
    if (!$("speak").checked || !("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "es-CO";
    window.speechSynthesis.speak(u);
  }

  async function send(text) {
    addMessage("Tu", text);
    setStatus("Procesando...");
    try {
      const res = await fetch("/api/assistant", {
        method: "POST",
        headers: { "content-type": "application/json", authorization: `Bearer ${token}` },
        body: JSON.stringify({ message: text, context }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Error del servidor");
      context = data.context || {};
      addMessage("Asistente", data.reply, data.options);
      speak(data.speech);
      setStatus("");
    } catch (e) {
      addMessage("Asistente", `Hubo un problema: ${e.message}`);
      setStatus("");
    }
  }

  $("enter").addEventListener("click", async () => {
    try {
      const res = await fetch("/api/demo-login", { method: "POST" });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      token = data.token;
      ["message", "send", "mic"].forEach((id) => { $(id).disabled = false; });
      $("enter").disabled = true;
      setStatus("Sesion iniciada como invitado.");
      $("message").focus();
    } catch (e) { setStatus(`No se pudo entrar: ${e.message}`); }
  });

  $("form").addEventListener("submit", (ev) => {
    ev.preventDefault();
    const text = $("message").value.trim();
    if (!text) return;
    $("message").value = "";
    send(text);
  });

  // Reconocimiento de voz del navegador (la voz se convierte a texto en el cliente).
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Recognition) {
    $("mic").title = "Tu navegador no permite dictado por voz; escribe tu mensaje.";
  } else {
    const rec = new Recognition();
    rec.lang = "es-CO";
    rec.onresult = (ev) => send(ev.results[0][0].transcript);
    rec.onend = () => { $("mic").setAttribute("aria-pressed", "false"); $("mic").textContent = "Hablar"; };
    rec.onerror = () => setStatus("No pude escucharte. Intenta de nuevo o escribe tu mensaje.");
    $("mic").addEventListener("click", () => {
      if ($("mic").getAttribute("aria-pressed") === "true") { rec.stop(); return; }
      window.speechSynthesis && window.speechSynthesis.cancel();
      $("mic").setAttribute("aria-pressed", "true");
      $("mic").textContent = "Escuchando... (pulsa para parar)";
      rec.start();
    });
  }
  if (!Recognition) $("mic").addEventListener("click", () => setStatus("Tu navegador no permite dictado por voz; escribe tu mensaje."));
</script>
</body>
</html>
